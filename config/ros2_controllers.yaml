controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    jearm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

jearm_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
      - joint7

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    allow_partial_joints_goal: false
    open_loop_control: true

    constraints:
      goal_time: 4.0  # 从 2.0 增加到 4.0，给硬件足够时间到达目标
      stopped_velocity_tolerance: 0.05
      # 平衡的容差设置：给硬件足够的回旋空间，但仍要求相对精确
      # goal: 目标位置容差 (执行完成时) - 允许 0.3 rad (~17°) 的误差
      # trajectory: 轨迹跟踪容差 (执行中) - 允许 0.5 rad 的轨迹偏差
      joint1: {trajectory: 0.5, goal: 0.3}   # 增加回 0.5/0.3 以容纳硬件限制
      joint2: {trajectory: 0.5, goal: 0.3}
      joint3: {trajectory: 0.5, goal: 0.3}
      joint4: {trajectory: 0.5, goal: 0.3}
      joint5: {trajectory: 0.5, goal: 0.3}
      joint6: {trajectory: 0.5, goal: 0.3}
      joint7: {trajectory: 0.5, goal: 0.3}
