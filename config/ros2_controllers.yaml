controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    jearm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

jearm_controller:
  ros__parameters:
    joints:
      - joint11
      - joint12
      - joint13
      - joint14
      - joint15
      - joint16
      - joint17
      - joint21
      - joint22
      - joint23
      - joint24
      - joint25
      - joint26
      - joint27

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    allow_partial_joints_goal: true
    open_loop_control: true

    constraints:
      goal_time: 4.0  # 从 2.0 增加到 4.0，给硬件足够时间到达目标
      stopped_velocity_tolerance: 0.05
      # 平衡的容差设置：给硬件足够的回旋空间，但仍要求相对精确
      # goal: 目标位置容差 (执行完成时) - 允许 0.3 rad (~17°) 的误差
      # trajectory: 轨迹跟踪容差 (执行中) - 允许 0.5 rad 的轨迹偏差
      joint11: {trajectory: 0.5, goal: 0.3}
      joint12: {trajectory: 0.5, goal: 0.3}
      joint13: {trajectory: 0.5, goal: 0.3}
      joint14: {trajectory: 0.5, goal: 0.3}
      joint15: {trajectory: 0.5, goal: 0.3}
      joint16: {trajectory: 0.5, goal: 0.3}
      joint17: {trajectory: 0.5, goal: 0.3}
      joint21: {trajectory: 0.5, goal: 0.3}
      joint22: {trajectory: 0.5, goal: 0.3}
      joint23: {trajectory: 0.5, goal: 0.3}
      joint24: {trajectory: 0.5, goal: 0.3}
      joint25: {trajectory: 0.5, goal: 0.3}
      joint26: {trajectory: 0.5, goal: 0.3}
      joint27: {trajectory: 0.5, goal: 0.3}
