# Kinematics configuration for L_JEARM
# Using Pick-IK solver

jearm:
  # Use KDL kinematics plugin (pick_ik is not present in this workspace/system)
  # If you have a pick_ik plugin installed, you can switch back to
  # `pick_ik/PickIkPlugin` and remove these comments.
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.005
  position_only_ik: false
