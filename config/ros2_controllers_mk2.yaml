controller_manager:
  ros__parameters:
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    jearm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

jearm_controller:
  ros__parameters:
    joints: [joint1, joint2, joint3, joint4, joint5, joint6, joint7]
    # Forward JTC's sampled velocity to the guarded driver; no PID adapter.
    command_interfaces: [position, velocity]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: false
    open_loop_control: false
    allow_nonzero_velocity_at_trajectory_end: false
    constraints:
      goal_time: 2.0
      stopped_velocity_tolerance: 0.05
      joint1: {trajectory: 0.15, goal: 0.03}
      joint2: {trajectory: 0.15, goal: 0.03}
      joint3: {trajectory: 0.15, goal: 0.03}
      joint4: {trajectory: 0.15, goal: 0.03}
      joint5: {trajectory: 0.15, goal: 0.03}
      joint6: {trajectory: 0.15, goal: 0.03}
      joint7: {trajectory: 0.15, goal: 0.03}