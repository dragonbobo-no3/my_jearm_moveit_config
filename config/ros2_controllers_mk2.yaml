controller_manager:
  ros__parameters:
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    jearm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_state_broadcaster:
  ros__parameters:
    # Global /joint_states is the SUB-only SDK receiver, independent of faults
    # in the command hardware lifecycle. Never re-stamp frozen driver state as
    # the robot's live feedback. Retain controller states on local diagnostics.
    use_local_topics: true

jearm_controller:
  ros__parameters:
    joints: [joint1, joint2, joint3, joint4, joint5, joint6, joint7]
    # Forward JTC's sampled velocity to the guarded driver; no PID adapter.
    command_interfaces: [position, velocity]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: false
    open_loop_control: false
    allow_nonzero_velocity_at_trajectory_end: false
    constraints:
      goal_time: 2.0
      stopped_velocity_tolerance: 0.05
      # Physical tracking lag measured ~0.17 s (0.15 rad at 0.9 rad/s). Keep
      # just below the native physical following tolerance 0.25 rad.
      joint1: {trajectory: 0.22, goal: 0.01}
      joint2: {trajectory: 0.22, goal: 0.01}
      joint3: {trajectory: 0.22, goal: 0.01}
      joint4: {trajectory: 0.22, goal: 0.01}
      joint5: {trajectory: 0.22, goal: 0.01}
      joint6: {trajectory: 0.22, goal: 0.01}
      joint7: {trajectory: 0.22, goal: 0.01}