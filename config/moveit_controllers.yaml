# MoveIt2 Controller Configuration
moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

# Trajectory execution timeout parameters
trajectory_execution:
  manage_controllers: true
  allowed_execution_timeout_scaling: 10.0  # Allow up to 10x the trajectory duration
  execution_duration_monitoring: true

moveit_simple_controller_manager:
  controller_names:
    - jearm_controller
  
  jearm_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - joint11
      - joint12
      - joint13
      - joint14
      - joint15
      - joint16
      - joint17
      - joint21
      - joint22
      - joint23
      - joint24
      - joint25
      - joint26
      - joint27
