# Planning pipelines configuration for MoveIt2

planning_pipelines:
  - ompl
  - pilz_industrial_motion_planner

default_planning_pipeline: ompl

# Compatibility keys for different MoveIt2 parameter-loading paths
request_adapters: >-
  default_planner_request_adapters/AddTimeOptimalParameterization
  default_planner_request_adapters/FixWorkspaceBounds
  default_planner_request_adapters/FixStartStateBounds
  default_planner_request_adapters/FixStartStateCollision
  default_planner_request_adapters/FixStartStatePathConstraints
totg:
  path_tolerance: 0.1
  resample_dt: 0.02
  min_angle_change: 0.001

ompl:
  planning_plugin: ompl_interface/OMPLPlanner
  request_adapters: >-
    default_planner_request_adapters/AddTimeOptimalParameterization
    default_planner_request_adapters/FixWorkspaceBounds
    default_planner_request_adapters/FixStartStateBounds
    default_planner_request_adapters/FixStartStateCollision
    default_planner_request_adapters/FixStartStatePathConstraints
  totg:
    path_tolerance: 0.1
    resample_dt: 0.02
    min_angle_change: 0.001
  start_state_max_bounds_error: 0.1
  jiggle_fraction: 0.05
  max_planning_threads: 4
  max_goal_samples: 8000
  max_state_memory: 10000
  execution_thread_spinning_interval: 0.001
  interpolation_method: half-linear

# Planning group specific configuration
jearm:
  planner_configs:
    - RRTConnect
    - RRT
    - RRTstar
    - TRRT
    - PRM
    - PRMstar
  default_planner_config: RRTConnect
  projection_evaluator: joints(joint1,joint2,joint3)
  longest_valid_segment_fraction: 0.001
  planner_timeout: 10.0
  num_planning_attempts: 10

# Planner configurations
planner_configs:
  RRTConnect:
    type: geometric::RRTConnect
    range: 0.0
  RRT:
    type: geometric::RRT
    range: 0.0
    goal_bias: 0.05
  RRTstar:
    type: geometric::RRTstar
    range: 0.0
    goal_bias: 0.05
    delay_collision_checking: 1
  TRRT:
    type: geometric::TRRT
    range: 0.0
    goal_bias: 0.05
    max_states_failed: 10
    temp_change_factor: 2.0
    min_temperature: 10e-10
    init_temperature: 10e-6
    frountier_threshold: 0.0
    frountierNodeRatio: 0.1
    k_constant: 0.0
  PRM:
    type: geometric::PRM
    max_nearest_neighbors: 10
  PRMstar:
    type: geometric::PRMstar

pilz_industrial_motion_planner:
  planning_group: jearm
  default_planner_id: PTP
  cartesian_limits:
    max_trans_vel: 1.0
    max_trans_acc: 2.0
    max_rot_vel: 1.57
    max_rot_acc: 3.15
  joint_limits:
    joint1:
      has_acceleration_limits: true
      max_acceleration: 2.0
    joint2:
      has_acceleration_limits: true
      max_acceleration: 2.0
    joint3:
      has_acceleration_limits: true
      max_acceleration: 2.0
    joint4:
      has_acceleration_limits: true
      max_acceleration: 2.0
    joint5:
      has_acceleration_limits: true
      max_acceleration: 2.0
    joint6:
      has_acceleration_limits: true
      max_acceleration: 2.0
    joint7:
      has_acceleration_limits: true
      max_acceleration: 2.0
